<!doctype html>
<html lang="ru" data-ry="13">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d10">
<meta name="raash-release" content="13.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="רעש יפה">
<title>רעש יפה — Музыкальная студия</title>
<meta name="description" content="רעש יפה: альбомы, версии A и B, свои записи и ссылки Suno.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app-v13.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">RY</div>
      <div class="brand-text">
        <strong dir="rtl">רעש יפה</strong>
        <span>RA'ASH YAFE</span>
      </div>
    </div>
    <button type="button" id="toolsBtn" aria-label="Студия и настройки">☰</button>
  </header>

  <section class="hero" aria-label="Текущий альбом">
    <div class="cover">
      <img id="cover" src="assets/front.webp" alt="Обложка альбома">
    </div>
    <div class="hero-copy">
      <p class="kicker">АЛЬБОМ</p>
      <h1 id="albumTitle" dir="auto">אני פה!</h1>
      <p id="counts" class="meta">11 песен</p>
      <div class="hero-actions">
        <button type="button" id="listen" class="primary">▶ Слушать</button>
        <button type="button" id="photos" class="quiet">Фото</button>
      </div>
    </div>
  </section>

  <section class="film" aria-label="Фотографии группы">
    <button type="button" class="shot" data-photo="front"><img src="assets/front.webp" alt="Обложка альбома אני פה!"><span>Альбом</span></button>
    <button type="button" class="shot" data-photo="studio"><img src="assets/studio.webp" alt="Группа в студии"><span>Студия</span></button>
    <button type="button" class="shot" data-photo="live"><img src="assets/live.webp" alt="Группа на выступлении"><span>Сцена</span></button>
    <button type="button" class="shot" data-photo="back"><img src="assets/back.webp" alt="Задняя обложка альбома"><span>Оборот</span></button>
  </section>

  <section class="home-actions" aria-label="Основные действия">
    <button type="button" id="fromSuno">Из Suno</button>
    <button type="button" id="addMusic">Добавить музыку</button>
    <button type="button" id="saveAll">Сохранить всё</button>
  </section>

  <section class="library" aria-label="Песни">
    <div class="list-head" id="listHead">
      <h2>Песни альбома</h2>
      <span id="listMeta"></span>
    </div>
    <div id="albums" class="albums" hidden></div>
    <div id="songList"></div>
  </section>
  <p class="footnote">Студия 13.0. Свои MP3 остаются на этом iPhone. Ссылка Suno — не файл. Перед очисткой Safari нажми «Сохранить всё».</p>
</div>

<div id="ryRec" class="rec" hidden>
  <span>Идёт запись</span>
  <b id="ryRecClock">0:00</b>
  <button type="button" id="ryRecStop">Стоп</button>
</div>

<div class="dock" id="dock">
  <div class="dock-main">
    <div class="mark" aria-hidden="true">RY</div>
    <div class="now">
      <b id="nowTitle">Выбери песню</b>
      <small id="nowSub">Плеер</small>
    </div>
    <div class="transport">
      <button type="button" id="prev" aria-label="Предыдущая">‹</button>
      <button type="button" id="play" class="play" aria-label="Воспроизведение или пауза">▶</button>
      <button type="button" id="next" aria-label="Следующая">›</button>
    </div>
  </div>
  <div class="seek">
    <span id="elapsed">0:00</span>
    <input id="range" type="range" min="0" max="1000" value="0" step="1" aria-label="Позиция">
    <span id="duration">0:00</span>
  </div>
</div>

<div id="overlay" class="overlay" role="dialog" aria-modal="true">
  <div class="sheet">
    <div class="sheethead">
      <h2 id="sheettitle">Студия</h2>
      <button type="button" id="close" class="iconbtn" aria-label="Закрыть">×</button>
    </div>
    <div id="sheetbody"></div>
  </div>
</div>

<input id="mediafile" type="file" accept="audio/*,video/*,.mp3,.m4a,.wav,.aac,.flac,.mp4,.mov" hidden>
<input id="imagefile" type="file" accept="image/*" hidden>
<input id="bulkfiles" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.flac" multiple hidden>
<input id="importjson" type="file" accept="application/json,.json" hidden>
<input id="importzip" type="file" accept=".zip,application/zip,application/x-zip-compressed" hidden>
<audio id="audio" preload="metadata" playsinline></audio>

<script src="backup.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=[['אני פה!','ANI PO!'],['כל העיר ערה!','KOL HAIR ERA!'],['אש בלב','ESH BALEV'],['אל תלכי','AL TELCHI'],['די כבר!','DAI KVAR!'],['תני לי סימן!','TNI LI SIMAN!'],['אין לי זמן!','EIN LI ZMAN!'],['הכול מסתובב!','HAKOL MISTOVEV!']];
function makeSong(name,trans){return {id:'song-'+Math.random().toString(36).slice(2,12),name,trans:trans||'',variants:[{fileKey:null,fileName:'',suno:''},{fileKey:null,fileName:'',suno:''}],videoKey:null};}
function initial(){return {current:'ani-po',albums:[{id:'ani-po',name:'אני פה!',description:'Первый альбом',coverKey:null,backKey:null,tracks:seed.map(x=>makeSong(x[0],x[1]))}]};}
let library;try{library=JSON.parse(localStorage.getItem('raash-yafe-library-v1'))||initial()}catch(e){library=initial()}
if(!Array.isArray(library.albums)||!library.albums.length)library=initial();
let libraryDirty=false;
function rememberMigration(flag){
  library.migrations=Array.isArray(library.migrations)?library.migrations:[];
  if(!library.migrations.includes(flag)){library.migrations.push(flag);libraryDirty=true}
}
if(!library.migrations?.includes('new-songs-9-11')){
  const first=library.albums.find(a=>a.id==='ani-po');
  if(first&&Array.isArray(first.tracks)){
    [['תתקרבי אליי','TITKARVI ELAI — Подойди ко мне ближе'],['אני פה! (ACID RIOT REMIX)','ANI PO! ACID RIOT REMIX feat. ACIDA'],['בא לי רעש!','BA LI RAASH! feat. ACIDA']].forEach(x=>{
      if(!first.tracks.some(t=>t.name===x[0]))first.tracks.push(makeSong(x[0],x[1]));
    });
  }
  rememberMigration('new-songs-9-11');
}
/* Same non-destructive reference as v9: only an empty A of «אני פה!» receives this short link. */
const KNOWN_SUNO_KEY='raash-yafe-v9-seeded-known-reference';
const KNOWN_SUNO='https://suno.com/s/BR9oVyNqADjGCuVu';
if(!library.migrations?.includes(KNOWN_SUNO_KEY)){
  const album=library.albums.find(a=>a.id==='ani-po');
  const track=album?.tracks?.find(x=>x.name==='אני פה!');
  const slot=track?.variants?.[0];
  const known=(library.albums||[]).some(a=>(a.tracks||[]).some(t=>(t.variants||[]).some(v=>String(v.suno||'').toLowerCase()===KNOWN_SUNO.toLowerCase())));
  if(slot&&!known&&!slot.suno&&!slot.fileKey)slot.suno=KNOWN_SUNO;
  rememberMigration(KNOWN_SUNO_KEY);
}
for(const album of library.albums){
  if(!Array.isArray(album.tracks)){album.tracks=[];libraryDirty=true}
  for(const track of album.tracks){
    if(!Array.isArray(track.variants)){track.variants=[];libraryDirty=true}
    while(track.variants.length<2){track.variants.push({fileKey:null,fileName:'',suno:''});libraryDirty=true}
  }
}
if(libraryDirty){try{localStorage.setItem('raash-yafe-library-v1',JSON.stringify(library))}catch(e){}}
let current=library.albums.find(a=>a.id===library.current)||library.albums[0];
let selected=null,playerObject=null,dbPromise;
const audio=$('#audio');
function save(){library.current=current.id;try{localStorage.setItem('raash-yafe-library-v1',JSON.stringify(library))}catch(e){notify('Недостаточно памяти для настроек')}}
function openDB(){if(dbPromise)return dbPromise;dbPromise=new Promise((ok,no)=>{const r=indexedDB.open('raash-yafe-media',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});return dbPromise}
function idbDone(tx){return new Promise((ok,no)=>{tx.oncomplete=()=>ok();tx.onerror=()=>no(tx.error||new Error('Не удалось записать файл'));tx.onabort=()=>no(tx.error||new Error('Запись файла прервана'))})}
function asMedia(value){
  if(!value)return null;
  if(value instanceof Blob)return value;
  if(value.ry==='bytes'&&value.buffer)return new File([value.buffer],value.name||'media',{type:value.type||'application/octet-stream'});
  return null;
}
async function put(key,blob){
  const db=await openDB();
  const write=value=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(value,key);return idbDone(tx)};
  try{await write(blob)}
  catch(err){
    if(!(blob instanceof Blob))throw err;
    // Some WebKit builds reject Blob/File values. The bytes stay in the same store and are read back as a file.
    const buffer=await blob.arrayBuffer();
    await write({ry:'bytes',type:blob.type||'application/octet-stream',name:blob.name||'',buffer});
  }
}
async function get(key){if(!key)return null;const db=await openDB();return new Promise((ok,no)=>{const r=db.transaction('files').objectStore('files').get(key);r.onsuccess=()=>ok(asMedia(r.result));r.onerror=()=>no(r.error)})}
async function remove(key){if(!key)return;const db=await openDB();return new Promise((ok,no)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(key);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})}
function notify(s){let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.setAttribute('role','status');document.body.append(el)}el.textContent=s;clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.remove(),3400)}
function openSheet(title,body){$('#sheettitle').textContent=title;$('#sheetbody').innerHTML=body;$('#overlay').classList.add('show')}
function closeSheet(){const frame=$('#sheetbody iframe[src^="https://suno.com/embed/"]');if(frame)frame.src='about:blank';$('#overlay').classList.remove('show')}
$('#close').onclick=closeSheet;
$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeSheet()});
function albumSong(id){return current.tracks.find(x=>x.id===id)}
function fmt(n){if(!Number.isFinite(n)||n<0)return '0:00';return Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0')}
function applyVolume(){
  const raw=Number(library.volume);
  audio.volume=Number.isFinite(raw)?Math.max(0,Math.min(1,raw)):1;
}
function paint(){
  current=library.albums.find(a=>a.id===library.current)||library.albums[0];
  applyVolume();
  if(window.RaashV13)window.RaashV13.render();
}
function chooseVariant(id,v){
  const t=albumSong(id);if(!t)return;
  selected={id,v};
  const z=t.variants[v];
  if(z?.fileKey)startPlay(t,v);
  else if(z?.suno)playSavedSuno(id,v);
  else if(window.RaashYafeV9?.showAttach)window.RaashYafeV9.showAttach(id,v);
  else if(window.RaashStudioV4)window.RaashStudioV4.openFor(id,v);
  else editVariant(id,v);
}
function playSavedSuno(id,v){
  const handler=window.RaashSunoV8?.openStream||window.RaashSunoV6?.openStream||window.RaashStudioV4?.openLinked;
  if(handler)return handler(id,v);
  editVariant(id,v);
}
function editVariant(id,v){
  const t=albumSong(id);if(!t)return;
  selected={id,v};
  const z=t.variants[v];
  openSheet('Версия '+(v?'B':'A')+' · '+t.name,'<p>Своя запись играет без интернета. Ссылка Suno только открывает встроенный плеер и не сохраняет MP3.</p><label class="field">Ссылка Suno на эту версию</label><input class="fieldinput" id="slink" type="url" placeholder="https://suno.com/song/..." value="'+esc(z.suno)+'"><div class="actions"><button type="button" class="quiet" id="saveLink">Сохранить ссылку</button></div><button type="button" class="primary" id="attachFile">Добавить MP3 / WAV</button>'+(z.fileKey?'<button type="button" class="quiet danger" id="forgetFile">Убрать файл</button><p>'+esc(z.fileName)+'</p>':''));
  $('#saveLink').onclick=()=>{const link=$('#slink').value.trim();if(link&&!/^https:\/\/(www\.)?suno\.com\/(song|embed|s)\//i.test(link)){notify('Нужна ссылка на песню Suno');return}z.suno=link;save();closeSheet();paint();notify(link?'Ссылка сохранена':'Ссылка убрана')};
  $('#attachFile').onclick=()=>{if(window.RaashV13?.attachLocal)window.RaashV13.attachLocal(id,v);else {$('#mediafile').setAttribute('accept','audio/*,.mp3,.m4a,.wav,.aac,.flac');$('#mediafile').click()}};
  if($('#forgetFile'))$('#forgetFile').onclick=async()=>{await remove(z.fileKey);z.fileKey=null;z.fileName='';save();closeSheet();paint()};
}
async function startPlay(t,v){
  const z=t.variants[v];
  if(!z?.fileKey){
    if(z?.suno)return playSavedSuno(t.id,v);
    if(window.RaashStudioV4)return window.RaashStudioV4.openFor(t.id,v);
    return editVariant(t.id,v);
  }
  try{
    const blob=await get(z.fileKey);
    if(!blob){z.fileKey=null;save();paint();notify('Файл не найден. Добавь запись ещё раз.');return}
    audio.pause();
    if(playerObject)URL.revokeObjectURL(playerObject);
    playerObject=URL.createObjectURL(blob);
    audio.src=playerObject;
    selected={id:t.id,v};
    applyVolume();
    if(window.RaashV13)window.RaashV13.noteLocal(t,v);
    await audio.play();
    paint();
  }catch(e){notify('Не удалось воспроизвести. Проверь формат файла.')}
}
function playSong(id){
  const t=albumSong(id);if(!t)return;
  const file=t.variants.findIndex(x=>x.fileKey);
  if(file>=0)return startPlay(t,file);
  const link=t.variants.findIndex(x=>x.suno);
  if(link>=0)return playSavedSuno(t.id,link);
  if(window.RaashYafeV9?.showAttach)return window.RaashYafeV9.showAttach(t.id,0);
  if(window.RaashStudioV4)return window.RaashStudioV4.openFor(t.id,0);
  editVariant(t.id,0);
}
function nextPrev(dir){
  let i=selected?current.tracks.findIndex(t=>t.id===selected.id):-1;
  for(let n=0;n<current.tracks.length;n++){
    i=(i+dir+current.tracks.length)%current.tracks.length;
    const t=current.tracks[i];
    const v=t.variants.findIndex(x=>x.fileKey);
    if(v>=0){startPlay(t,v);return}
  }
  notify('Нет других сохранённых записей');
}
audio.addEventListener('ended',()=>nextPrev(1));
$('#mediafile').onchange=async e=>{
  const f=e.target.files[0];
  e.target.value='';
  if(!f||!selected)return;
  const t=albumSong(selected.id);if(!t)return;
  if(selected.video){
    selected.video=false;
    $('#mediafile').setAttribute('accept','audio/*,.mp3,.m4a,.wav,.aac,.flac');
    if(!(/^video\//.test(f.type)||/\.(mp4|mov)$/i.test(f.name))){notify('Нужно видео MP4 или MOV');return}
    try{const key='video:'+current.id+':'+t.id;await put(key,f);t.videoKey=key;save();closeSheet();paint();notify('Клип сохранён')}
    catch(err){notify('Не удалось сохранить клип')}
    return;
  }
  if(!f.type.startsWith('audio/')&&!/\.(mp3|wav|m4a|aac|flac|ogg|opus)$/i.test(f.name)){notify('Нужен файл MP3, WAV или M4A');return}
  const z=t.variants[selected.v];if(!z)return;
  const key='audio:'+current.id+':'+t.id+':'+selected.v+':'+Date.now();
  try{await put(key,f);z.fileKey=key;z.fileName=f.name;save();closeSheet();paint();notify('Сохранено: '+f.name)}
  catch(err){notify('Не удалось сохранить. Проверь свободное место.')}
};
window.imageTarget='coverKey';
$('#imagefile').onchange=async e=>{
  const f=e.target.files[0];
  e.target.value='';
  if(!f||!f.type.startsWith('image/'))return;
  try{if(window.RaashV13?.consumeImage&&await window.RaashV13.consumeImage(f))return}catch(err){notify('Не удалось сохранить изображение');return}
  const target=window.imageTarget==='backKey'?'backKey':'coverKey';
  const key='image:'+current.id+':'+target;
  try{await put(key,f);current[target]=key;save();paint();notify('Обложка сохранена')}
  catch(x){notify('Не удалось сохранить изображение')}
};
function addAlbum(){
  openSheet('Новый альбом','<p>Старые песни и записи останутся на месте.</p><label class="field">Название</label><input id="aname" class="fieldinput" placeholder="שם האלבום"><label class="field">Подпись</label><input id="adesc" class="fieldinput" placeholder="Новый альбом"><button type="button" id="commitAlbum" class="primary">Создать альбом</button>');
  $('#commitAlbum').onclick=()=>{
    const name=$('#aname').value.trim();if(!name){notify('Введите название альбома');return}
    const album={id:'album-'+Date.now(),name,description:$('#adesc').value.trim()||'Новый альбом',coverKey:null,backKey:null,tracks:[]};
    library.albums.push(album);current=album;library.current=album.id;save();closeSheet();paint();notify('Альбом создан');
  };
}
function editSong(id){
  const t=albumSong(id);if(!t)return;
  openSheet('Песня · '+t.name,'<label class="field">Название</label><input id="editname" class="fieldinput" value="'+esc(t.name)+'"><label class="field">Подпись</label><input id="edittrans" class="fieldinput" value="'+esc(t.trans)+'"><button type="button" class="primary" id="editsave">Сохранить</button><div class="actions"><button type="button" class="quiet" id="manageA">Версия A</button><button type="button" class="quiet" id="manageB">Версия B</button></div><button type="button" class="quiet danger" id="delTrack">Удалить песню из альбома</button>');
  $('#editsave').onclick=()=>{const n=$('#editname').value.trim();if(n)t.name=n;t.trans=$('#edittrans').value.trim();save();closeSheet();paint()};
  $('#manageA').onclick=()=>editVariant(id,0);
  $('#manageB').onclick=()=>editVariant(id,1);
  $('#delTrack').onclick=()=>{if(!confirm('Убрать песню из альбома?'))return;current.tracks=current.tracks.filter(x=>x.id!==id);if(selected?.id===id)selected=null;save();closeSheet();paint()};
}
$('#bulkfiles').onchange=async e=>{
  const files=[...e.target.files];
  e.target.value='';
  if(!files.length)return;
  const audioFiles=files.filter(f=>f.type.startsWith('audio/')||/\.(mp3|wav|m4a|aac|flac|ogg|opus)$/i.test(f.name));
  if(!audioFiles.length){notify('Нужны файлы MP3, WAV или M4A');return}
  const norm=s=>String(s||'').toLocaleLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
  let added=0;const unmatched=[];const used=new Set();
  for(const f of audioFiles){
    const low=norm(f.name.replace(/\.[^.]+$/,''));
    const match=current.tracks.find(t=>[t.name,t.trans].some(x=>{const n=norm(x);return n.length>2&&low.includes(n)}));
    let variant=-1;
    if(match){
      if(/(?:^|[\s._-])(?:b|v2|ver2|version2)(?:[\s._-]|$)/i.test(f.name))variant=1;
      else if(/(?:^|[\s._-])(?:a|v1|ver1|version1)(?:[\s._-]|$)/i.test(f.name))variant=0;
      else variant=match.variants.findIndex(v=>!v.fileKey);
    }
    const slot=match&&variant>=0?match.id+':'+variant:'';
    if(!match||variant<0||match.variants[variant].fileKey||used.has(slot)){unmatched.push(f);continue}
    try{
      const key='audio:'+current.id+':'+match.id+':'+variant+':'+Date.now();
      await put(key,f);match.variants[variant].fileKey=key;match.variants[variant].fileName=f.name;used.add(slot);added++;
    }catch(err){unmatched.push(f)}
  }
  save();paint();
  if(!unmatched.length){notify('Добавлено записей: '+added);return}
  const options='<option value="">Не добавлять</option>'+current.tracks.flatMap(t=>t.variants.map((v,j)=>'<option value="'+esc(t.id)+'|'+j+'" '+(v.fileKey?'disabled':'')+'>'+esc(t.name)+' — '+(j?'B':'A')+(v.fileKey?' (занято)':'')+'</option>')).join('');
  openSheet('Куда положить файлы','<p>Само нашлось: '+added+'. Для остальных выбери песню и версию. Уже занятые версии не перезаписываются.</p>'+unmatched.map((f,i)=>'<label class="field">'+esc(f.name)+'</label><select class="fieldinput" data-match="'+i+'">'+options+'</select>').join('')+'<button type="button" id="applyMatches" class="primary">Сохранить выбранное</button>');
  $('#applyMatches').onclick=async()=>{
    const picked=new Set();
    for(let i=0;i<unmatched.length;i++){
      const val=$('[data-match="'+i+'"]').value;if(!val)continue;
      if(picked.has(val)){notify('Одной версии можно назначить только один файл');return}
      picked.add(val);
    }
    let count=0;
    try{
      for(let i=0;i<unmatched.length;i++){
        const val=$('[data-match="'+i+'"]').value;if(!val)continue;
        const [id,j]=val.split('|');const t=albumSong(id);const v=t?.variants[Number(j)];
        if(!v||v.fileKey)continue;
        const key='audio:'+current.id+':'+id+':'+j+':'+Date.now();
        await put(key,unmatched[i]);v.fileKey=key;v.fileName=unmatched[i].name;count++;
      }
      save();closeSheet();paint();notify('Добавлено вручную: '+count);
    }catch(err){save();paint();notify('Не удалось сохранить файл')}
  };
};
async function createFullBackup(){
  openSheet('Резервная копия','<p>Собираю альбомы, версии A и B, дубли, клипы и обложки в один ZIP.</p><div id="backupProgress" class="status">Подготовка...</div>');
  const info=$('#backupProgress');
  try{
    const result=await RaashBackup.exportAll(library,get,msg=>{if(info)info.textContent=msg});
    const url=URL.createObjectURL(result.archive);
    const name='Raash-Yafe-FULL-'+new Date().toISOString().slice(0,10)+'.zip';
    openSheet('Копия готова','<p>В архиве '+result.fileCount+' файлов и все альбомы. Ссылки Suno сохранены как ссылки, не как MP3.</p><a id="downloadZip" class="primary" download="'+name+'" href="'+url+'">Сохранить ZIP</a>'+(result.missing.length?'<p class="warn">Не найдено ранее прикреплённых файлов: '+result.missing.length+'. Остальное на месте.</p>':'')+'<p>Сохрани архив в «Файлы» или iCloud. Пока он не сохранён, не очищай данные сайта.</p>');
    $('#close').addEventListener('click',()=>setTimeout(()=>URL.revokeObjectURL(url),60000),{once:true});
  }catch(err){openSheet('Копия не собрана','<p>'+esc(err?.message||err)+'</p><p>Записи в приложении не удалены.</p>')}
}
$('#importzip').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  if(!confirm('Восстановить альбомы из этого ZIP? Текущий список будет заменён. Сначала сохрани копию, если она нужна.'))return;
  openSheet('Восстановление','<p>Возвращаю песни, обложки и записи.</p><div class="status" id="restoreProgress">Чтение архива...</div>');
  const info=$('#restoreProgress');
  try{
    const result=await RaashBackup.restoreAll(f,put,msg=>{if(info)info.textContent=msg});
    audio.pause();audio.removeAttribute('src');audio.load();
    if(playerObject){URL.revokeObjectURL(playerObject);playerObject=null}
    library=result.library;
    current=library.albums.find(a=>a.id===library.current)||library.albums[0];
    selected=null;save();closeSheet();paint();
    notify('Восстановлено файлов: '+result.restored);
  }catch(err){openSheet('Не удалось восстановить','<p>'+esc(err?.message||err)+'</p><p>Текущий альбом не заменён.</p>')}
};
$('#importjson').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const parsed=JSON.parse(await f.text());
    if(!Array.isArray(parsed.albums)||!parsed.albums.length)throw new Error('format');
    if(!confirm('Заменить список альбомов этим файлом? Сами записи в памяти телефона останутся, но связь с ними может пропасть.'))return;
    library=parsed;current=parsed.albums.find(a=>a.id===parsed.current)||parsed.albums[0];selected=null;save();closeSheet();paint();notify('Список альбомов заменён');
  }catch(err){notify('Не удалось прочитать список')}
};
applyVolume();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});
